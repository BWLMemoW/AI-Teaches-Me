<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>三维视图</title>
  <!--
    M32 三维交互视图模板（《项目文档》§8.4.3）。
    约束（改这个文件必须守住）：
      * 纯 Canvas 2D 软件渲染：无 WebGL、无 CDN、无外部资源、无网络请求；
      * 文件里不允许出现任何远程地址字面量（prepare_animation_html 会把它们替换成空串，破坏代码）；
      * 配色只用宿主注入的 --atm-fg / --atm-bg / --atm-primary，明暗主题都可用；
      * 支持 prefers-reduced-motion（降低动效时不做自动旋转）；
      * 几何数据由 Python 注入到下方 id="atm-geo" 的 JSON 脚本里。
  -->
  <script id="atm-geo" type="application/json">__ATM_GEOMETRY_JSON__</script>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; height: 100%; }
    body {
      background: var(--atm-bg, #ffffff);
      color: var(--atm-fg, #222222);
      font-family: "Microsoft YaHei", "微软雅黑", "Segoe UI", sans-serif;
      font-size: 12px;
    }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas.atm-grabbing { cursor: grabbing; }
    #bar {
      position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center;
      gap: 6px; flex-wrap: wrap; padding: 6px 8px; border-radius: 10px;
      background: var(--atm-surface, rgba(255, 255, 255, 0.86));
      border: 1px solid var(--atm-border, rgba(0, 0, 0, 0.12)); opacity: 0.94;
    }
    button {
      font: inherit; color: inherit; cursor: pointer; padding: 3px 9px; border-radius: 8px;
      border: 1px solid var(--atm-border, rgba(0, 0, 0, 0.16));
      background: var(--atm-surface-alt, transparent);
    }
    button:hover { border-color: var(--atm-primary, #e86a92); }
    .atm-hint { opacity: 0.7; margin-left: 2px; }
    #atm-title {
      position: absolute; left: 12px; top: 10px; opacity: 0.75; letter-spacing: 0.02em;
    }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="atm-canvas"></canvas>
    <div id="atm-title"></div>
    <div id="bar">
      <button type="button" data-act="mode">线框</button>
      <button type="button" data-act="spin">暂停自转</button>
      <button type="button" data-act="reset">重置视角</button>
      <span class="atm-hint">拖拽旋转 · 滚轮缩放</span>
    </div>
  </div>
  <script>
  (function () {
    "use strict";
    var reduceMotion = false;
    try {
      reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    } catch (error) { reduceMotion = false; }

    function readGeometry() {
      var node = document.getElementById("atm-geo");
      try {
        return JSON.parse((node && node.textContent) || "{}");
      } catch (error) {
        return {};
      }
    }

    var geometry = readGeometry();
    var vertices = Array.isArray(geometry.vertices) ? geometry.vertices : [];
    var faces = Array.isArray(geometry.faces) ? geometry.faces : [];
    var lines = Array.isArray(geometry.lines) ? geometry.lines : [];
    var lineStyles = Array.isArray(geometry.line_styles) ? geometry.line_styles : [];
    var faceOpacities = Array.isArray(geometry.face_opacities) ? geometry.face_opacities : [];
    var labels = Array.isArray(geometry.labels) ? geometry.labels : [];
    var showAxes = geometry.axes !== false;
    var closed = geometry.closed !== false;
    var baseAz = typeof geometry.az === "number" ? geometry.az : -35;
    var baseEl = typeof geometry.el === "number" ? geometry.el : 25;

    var canvas = document.getElementById("atm-canvas");
    var context = canvas.getContext("2d");
    var titleNode = document.getElementById("atm-title");
    titleNode.textContent = geometry.title || "";

    var view = { az: baseAz, el: baseEl, zoom: 1, spin: !reduceMotion, wire: false, dragging: false, lastX: 0, lastY: 0 };
    var metrics = null;

    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    function cross(a, b) {
      return [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    }
    function norm(a) {
      var length = Math.sqrt(dot(a, a)) || 1;
      return [a[0] / length, a[1] / length, a[2] / length];
    }
    function basis() {
      var azimuth = view.az * Math.PI / 180;
      var elevation = Math.max(-85, Math.min(85, view.el)) * Math.PI / 180;
      var direction = [
        Math.cos(elevation) * Math.cos(azimuth),
        Math.cos(elevation) * Math.sin(azimuth),
        Math.sin(elevation)
      ];
      var right = cross([0, 0, 1], direction);
      if (Math.sqrt(dot(right, right)) < 1e-9) { right = [1, 0, 0]; }
      right = norm(right);
      return { d: direction, r: right, u: cross(direction, right) };
    }
    function themeColor(name, fallback) {
      var value = "";
      try {
        value = getComputedStyle(document.documentElement).getPropertyValue(name) || "";
      } catch (error) { value = ""; }
      value = value.trim();
      return value || fallback;
    }

    function computeMetrics(width, height) {
      var frame = basis();
      var anchors = [];
      labels.forEach(function (item) {
        if (Array.isArray(item.at) && item.at.length === 3) { anchors.push(item.at); }
      });
      var cloud = vertices.concat(anchors);  // 标注锚点一起取景，标注才不会跑出画面
      var radius = 1e-6, index;
      for (index = 0; index < cloud.length; index += 1) {
        radius = Math.max(radius, Math.sqrt(dot(cloud[index], cloud[index])));
      }
      var distance = 3.2 * radius;
      var projected = [], depths = [];
      for (index = 0; index < cloud.length; index += 1) {
        var vertex = cloud[index];
        var depth = Math.max(distance - dot(vertex, frame.d), 0.08 * radius);
        var scale = distance / depth;
        projected.push([dot(vertex, frame.r) * scale, dot(vertex, frame.u) * scale]);
        depths.push(depth);
      }
      if (!projected.length) { projected = [[0, 0]]; depths = [distance]; }
      var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      projected.forEach(function (point) {
        minX = Math.min(minX, point[0]); maxX = Math.max(maxX, point[0]);
        minY = Math.min(minY, point[1]); maxY = Math.max(maxY, point[1]);
      });
      var spanX = (maxX - minX) || 1, spanY = (maxY - minY) || 1;
      var fit = Math.min(width * 0.76 / spanX, height * 0.76 / spanY);
      return {
        frame: frame, radius: radius, projected: projected, depths: depths,
        vertexCount: vertices.length,
        fit: fit, midX: (minX + maxX) / 2, midY: (minY + maxY) / 2,
        width: width, height: height
      };
    }

    function toScreen(point) {
      var scale = metrics.fit * view.zoom;
      return [
        metrics.width / 2 + (point[0] - metrics.midX) * scale,
        metrics.height / 2 - (point[1] - metrics.midY) * scale
      ];
    }

    function faceNormal(face) {
      if (face.length < 3) { return [0, 0, 1]; }
      var a = vertices[face[0]], b = vertices[face[1]], c = vertices[face[2]];
      return norm(cross([b[0] - a[0], b[1] - a[1], b[2] - a[2]], [c[0] - b[0], c[1] - b[1], c[2] - b[2]]));
    }

    function draw() {
      var parent = canvas.parentNode;
      var width = canvas.clientWidth || (parent && parent.clientWidth) || 320;
      var height = canvas.clientHeight || (parent && parent.clientHeight) || 240;
      var ratio = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
        canvas.width = Math.round(width * ratio);
        canvas.height = Math.round(height * ratio);
      }
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      context.clearRect(0, 0, width, height);
      context.fillStyle = themeColor("--atm-bg", "#ffffff");
      context.fillRect(0, 0, width, height);
      if (!vertices.length) { return; }

      metrics = computeMetrics(width, height);
      var foreground = themeColor("--atm-fg", "#222222");
      var primary = themeColor("--atm-primary", "#e86a92");
      var screen = metrics.projected.map(toScreen);
      var direction = metrics.frame.d;

      if (!view.wire && faces.length) {
        var order = [];
        faces.forEach(function (face, index) {
          var facing = dot(faceNormal(face), direction);
          if (closed && facing <= 0) { return; }
          var depth = 0;
          face.forEach(function (vertex) { depth += metrics.depths[vertex] || 0; });
          order.push({ i: index, depth: depth / face.length, light: Math.abs(facing) });
        });
        order.sort(function (a, b) { return b.depth - a.depth; });
        context.lineJoin = "round";
        order.forEach(function (item) {
          var face = faces[item.i];
          context.beginPath();
          face.forEach(function (vertex, position) {
            var point = screen[vertex];
            if (position === 0) { context.moveTo(point[0], point[1]); }
            else { context.lineTo(point[0], point[1]); }
          });
          context.closePath();
          context.globalAlpha = faceOpacities.length
            ? (faceOpacities[item.i] || 0.14)
            : (0.12 + 0.30 * item.light);
          context.fillStyle = primary;
          context.fill();
        });
        context.globalAlpha = 1;
      }

      context.strokeStyle = foreground;
      context.globalAlpha = 0.55;
      context.lineWidth = 1;
      if (lines.length) {
        lines.forEach(function (chain, lineIndex) {
          var style = lineStyles[lineIndex] || "solid";
          context.setLineDash(style === "dashed" ? [5, 4] : []);
          context.beginPath();
          chain.forEach(function (vertex, position) {
            var point = screen[vertex];
            if (position === 0) { context.moveTo(point[0], point[1]); }
            else { context.lineTo(point[0], point[1]); }
          });
          context.stroke();
          if (style === "arrow" && chain.length >= 2) {
            drawArrow(screen[chain[chain.length - 2]], screen[chain[chain.length - 1]]);
          }
        });
        context.setLineDash([]);
      } else {
        var seen = {};
        faces.forEach(function (face) {
          face.forEach(function (vertex, position) {
            var next = face[(position + 1) % face.length];
            var key = vertex < next ? vertex + ":" + next : next + ":" + vertex;
            if (seen[key]) { return; }
            seen[key] = 1;
            var start = screen[vertex], end = screen[next];
            context.beginPath();
            context.moveTo(start[0], start[1]);
            context.lineTo(end[0], end[1]);
            context.stroke();
          });
        });
      }
      context.globalAlpha = 1;

      var frame = metrics.frame;
      if (showAxes) {
        // 坐标轴：模型中心向外三条虚线 + 字母（光路这类场景图不画）
        var axisLength = metrics.radius * 0.85;
        var axisPoints = [[0, 0, 0], [axisLength, 0, 0], [0, axisLength, 0], [0, 0, axisLength]];
        var screenAxis = axisPoints.map(function (vertex) {
          var depth = Math.max(3.2 * metrics.radius - dot(vertex, frame.d), 0.08 * metrics.radius);
          var scale = 3.2 * metrics.radius / depth;
          return toScreen([dot(vertex, frame.r) * scale, dot(vertex, frame.u) * scale]);
        });
        context.setLineDash([4, 3]);
        context.globalAlpha = 0.45;
        for (var axis = 1; axis < screenAxis.length; axis += 1) {
          context.beginPath();
          context.moveTo(screenAxis[0][0], screenAxis[0][1]);
          context.lineTo(screenAxis[axis][0], screenAxis[axis][1]);
          context.stroke();
        }
        context.setLineDash([]);
        context.globalAlpha = 1;
        context.fillStyle = foreground;
        ["x", "y", "z"].forEach(function (label, index) {
          var point = screenAxis[index + 1];
          context.fillText(label, point[0] + 4, point[1] - 4);
        });
      }

      // 文字标注（物 / 小孔 / 屏 / 像……）
      context.fillStyle = foreground;
      labels.forEach(function (item, index) {
        var point = screen[metrics.vertexCount + index];
        if (!point) { return; }
        context.fillText(String(item.text || ""), point[0] + 6, point[1] - 6);
      });
    }

    function drawArrow(start, end) {
      var dx = end[0] - start[0], dy = end[1] - start[1];
      var length = Math.sqrt(dx * dx + dy * dy) || 1;
      var ux = dx / length, uy = dy / length, size = 8;
      var baseX = end[0] - ux * size, baseY = end[1] - uy * size;
      context.save();
      context.setLineDash([]);
      context.globalAlpha = 1;
      context.beginPath();
      context.moveTo(end[0], end[1]);
      context.lineTo(baseX - uy * size * 0.45, baseY + ux * size * 0.45);
      context.lineTo(baseX + uy * size * 0.45, baseY - ux * size * 0.45);
      context.closePath();
      context.fillStyle = themeColor("--atm-fg", "#222222");
      context.fill();
      context.restore();
    }

    var lastTime = 0;
    function tick(time) {
      var delta = lastTime ? Math.min(48, time - lastTime) : 16;
      lastTime = time;
      if (view.spin && !view.dragging && !reduceMotion) {
        view.az += delta * 0.012;
        if (view.az > 360) { view.az -= 360; }
        draw();
      }
      window.requestAnimationFrame(tick);
    }

    canvas.addEventListener("pointerdown", function (event) {
      view.dragging = true;
      view.lastX = event.clientX;
      view.lastY = event.clientY;
      canvas.classList.add("atm-grabbing");
      if (canvas.setPointerCapture) { canvas.setPointerCapture(event.pointerId); }
    });
    canvas.addEventListener("pointermove", function (event) {
      if (!view.dragging) { return; }
      view.az += (event.clientX - view.lastX) * 0.45;
      view.el = Math.max(-85, Math.min(85, view.el + (event.clientY - view.lastY) * 0.4));
      view.lastX = event.clientX;
      view.lastY = event.clientY;
      draw();
    });
    function stopDrag() {
      view.dragging = false;
      canvas.classList.remove("atm-grabbing");
    }
    canvas.addEventListener("pointerup", stopDrag);
    canvas.addEventListener("pointercancel", stopDrag);
    canvas.addEventListener("wheel", function (event) {
      event.preventDefault();
      view.zoom = Math.max(0.4, Math.min(3.2, view.zoom * (event.deltaY > 0 ? 0.92 : 1.08)));
      draw();
    }, { passive: false });

    document.getElementById("bar").addEventListener("click", function (event) {
      var button = event.target.closest ? event.target.closest("button") : null;
      if (!button) { return; }
      var action = button.getAttribute("data-act");
      if (action === "mode") {
        view.wire = !view.wire;
        button.textContent = view.wire ? "实体" : "线框";
        draw();
      } else if (action === "spin") {
        view.spin = !view.spin;
        button.textContent = view.spin ? "暂停自转" : "继续自转";
      } else if (action === "reset") {
        view.az = baseAz; view.el = baseEl; view.zoom = 1; view.wire = false;
        var modeButton = document.querySelector('button[data-act="mode"]');
        if (modeButton) { modeButton.textContent = "线框"; }
        draw();
      }
    });
    window.addEventListener("resize", draw);
    draw();
    window.requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
