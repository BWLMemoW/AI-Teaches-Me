<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Teaches Me · 动画沙箱</title>
  <!-- 宿主页禁网：只允许内联样式/脚本与 data: 图片（§4.7 安全边界） -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; connect-src 'none'; frame-src 'self' data: file:;" />
  <style>
    html, body { margin: 0; height: 100%; background: var(--atm-surface, #fff); }
    #atm-frame { width: 100%; height: 100%; border: 0; }
    #atm-fallback { display: none; padding: 16px; font: 14px/1.6 "Microsoft YaHei", sans-serif; color: var(--atm-text, #222); }
  </style>
</head>
<body>
  <iframe id="atm-frame" sandbox="allow-scripts" referrerpolicy="no-referrer"></iframe>
  <div id="atm-fallback"></div>
  <script>
    /* 5s 熔断：超时或加载失败时切换到 fallback_md（AC-25） */
    (function () {
      "use strict";
      var TIMEOUT_MS = 5000;
      var frame = document.getElementById("atm-frame");
      var fallback = document.getElementById("atm-fallback");
      var timer = null;

      function showFallback(text) {
        frame.style.display = "none";
        fallback.style.display = "block";
        fallback.textContent = text || "动画加载失败，已降级为文字说明。";
      }

      frame.addEventListener("load", function () {
        if (timer) { clearTimeout(timer); timer = null; }
      });

      window.ATMSandbox = {
        mount: function (html, fallbackMd) {
          if (timer) { clearTimeout(timer); }
          fallback.style.display = "none";
          frame.style.display = "block";
          frame.setAttribute("srcdoc", String(html || ""));
          timer = setTimeout(function () { showFallback(fallbackMd); }, TIMEOUT_MS);
          return true;
        },
        fallback: showFallback,
        getState: function () {
          return { mounted: Boolean(frame.getAttribute("srcdoc")), fallbackVisible: fallback.style.display === "block" };
        }
      };
    })();
  </script>
</body>
</html>
