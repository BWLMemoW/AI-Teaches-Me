[project]
name = "ai-teaches-me"
version = "0.0.1"
description = "AI Teaches Me —— AI 驱动的个性化自学平台（PC 桌面客户端）"
requires-python = ">=3.11"
# 依赖以 docs/项目文档.md §6.3 为准，与 requirements.txt 保持一致
dependencies = [
    "PySide6>=6.6",
    "openai>=2.0",
    "httpx>=0.27",
    "pypdf>=5.1",
    "python-pptx>=1.0",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "Markdown>=3.7",
    "pygments>=2.17",
    "keyring>=25.0",
    "platformdirs>=4.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-qt>=4.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "no_network: 该用例不得访问网络（见《项目文档》§15.3 无网络回归）",
]
